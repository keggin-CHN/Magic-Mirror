name: Build Server
on:
  workflow_dispatch:
  push:
    paths:
      - "src-python/**"
      - "scripts/build-windows-server.ps1"
      - "scripts/build-server.sh"
      - "scripts/install-windows-ort.ps1"
      - "scripts/verify-onnxruntime.py"
      - ".github/workflows/build-server.yaml"
      - "!src-python/web_server.py"
  pull_request:
    paths:
      - "src-python/**"
      - "scripts/build-windows-server.ps1"
      - "scripts/build-server.sh"
      - "scripts/install-windows-ort.ps1"
      - "scripts/verify-onnxruntime.py"
      - ".github/workflows/build-server.yaml"
      - "!src-python/web_server.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  models:
    name: Download Model Files
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Model Files
        id: cache-models
        uses: actions/cache@v4
        with:
          path: src-python/models
          key: models-v1.0.0-${{ runner.os }}
      - name: Download Model Files
        if: steps.cache-models.outputs.cache-hit != 'true'
        id: models
        run: |
          VERSION=$(awk -F ' = "' '/version =/ {print $2}' src-python/pyproject.toml | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mkdir -p src-python/models && cd src-python/models
          BASE_URL="https://github.com/keggin-CHN/Magic-Mirror/releases/download/models-1.0.0"
          for model in arcface_w600k_r50.onnx gfpgan_1.4.onnx inswapper_128_fp16.onnx scrfd_2.5g.onnx; do
            echo "Downloading $model..."
            curl --fail --location --retry 5 --retry-delay 10 --retry-max-time 60 --progress-bar -O "${BASE_URL}/${model}"
            echo "  -> $(ls -lh $model | awk '{print $5}')"
          done
          cd ${{ github.workspace }}
      - name: Get version (cached)
        if: steps.cache-models.outputs.cache-hit == 'true'
        run: |
          VERSION=$(awk -F ' = "' '/version =/ {print $2}' src-python/pyproject.toml | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        id: models-cached
      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: src-python/models
          if-no-files-found: error
    outputs:
      version: ${{ steps.models.outputs.version || steps.models-cached.outputs.version }}

  build-for-windows:
    name: Windows
    needs: models
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            build: windows
            os: windows-latest
            arch: x86_64
            runtime: directml
            bundle_cuda: false
            timeout: 180
          - target: x86_64-pc-windows-msvc
            build: windows
            os: windows-latest
            arch: x86_64
            runtime: cuda
            bundle_cuda: true
            timeout: 150

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: models
          path: src-python/models
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"
      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src-python/requirements.txt
          python -m pip install -e src-python --no-deps

          if ("${{ matrix.bundle_cuda }}" -eq "true") {
            ./scripts/install-windows-ort.ps1 `
              -Runtime "${{ matrix.runtime }}" `
              -BundleCudaDependencies
          } else {
            ./scripts/install-windows-ort.ps1 `
              -Runtime "${{ matrix.runtime }}"
          }
      - name: Build Server
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "directml") {
            ./scripts/build-windows-server.ps1 `
              -Runtime directml `
              -ConsoleMode disable `
              -CreateCompatibilityArchive
          } else {
            ./scripts/build-windows-server.ps1 `
              -Runtime cuda `
              -ConsoleMode disable
          }
      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server_${{ matrix.build }}_${{ matrix.arch }}_${{ matrix.runtime }}
          path: out/*.zip
          if-no-files-found: error

  build-for-linux:
    name: Linux
    needs: models
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            build: linux
            os: ubuntu-22.04
            arch: x86_64
            runtime: cpu
            timeout: 120
          - target: aarch64-unknown-linux-gnu
            build: linux
            os: ubuntu-24.04-arm
            arch: aarch64
            runtime: cpu
            timeout: 180

    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: models
          path: src-python/models
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential patchelf zip libgl1 libglib2.0-0
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src-python/requirements.txt
          python -m pip install -e src-python --no-deps
      - name: Build Server
        env:
          OUT_DIR: out
        run: |
          bash scripts/build-server.sh
      - name: Upload Server
        uses: actions/upload-artifact@v4
        with:
          name: server_${{ matrix.build }}_${{ matrix.arch }}_${{ matrix.runtime }}
          path: out/server.zip
          if-no-files-found: error

  release:
    name: Release
    # Publish on any main-branch build (push or manual dispatch) so releases
    # stay current without double-building the whole matrix.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: [models, build-for-windows, build-for-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          # Publish every server flavor: Windows DirectML (also aliased to the
          # legacy name the desktop client downloads), Windows CUDA (models
          # kept separate since the archive must stay under GitHub's 2 GiB
          # per-asset limit), and Linux x86_64 / aarch64 CPU builds.
          pattern: |
            server_windows_x86_64_directml
            server_windows_x86_64_cuda
            server_linux_x86_64_cpu
            server_linux_aarch64_cpu
          path: dist
          merge-multiple: true
      - name: Align asset names with client download template
        run: |
          cd dist
          # Desktop client resolves server_{{type}}_{{arch}}.zip
          mv -f server_windows_x86_64_directml.zip server_windows_x86_64.zip
          mv -f server_linux_x86_64_cpu.zip server_linux_x86_64.zip
          mv -f server_linux_aarch64_cpu.zip server_linux_aarch64.zip
          ls -lh
      - name: Release Server v${{ needs.models.outputs.version }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Server v${{ needs.models.outputs.version }}
          tag: server-v${{ needs.models.outputs.version }}
          body: |
            MagicMirror Server v${{ needs.models.outputs.version }}

            - `server_windows_x86_64.zip` — Windows CPU + DirectML（桌面端默认自动下载）
            - `server_windows_x86_64_cuda.zip` — Windows CUDA（NVIDIA 显卡手动安装；模型需从 models release 获取，桌面端会自动补下载）
            - `server_linux_x86_64.zip` — Linux x86_64 CPU
            - `server_linux_aarch64.zip` — Linux ARM64 CPU
          draft: true
          prerelease: false
          removeArtifacts: true
          artifacts: dist/*.zip
