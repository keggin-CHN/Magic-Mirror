plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magicmirror.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.magicmirror.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // 只保留 arm64-v8a（华为麒麟9000S / 高通骁龙 等主流 64 位 ARM）
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // 通过环境变量配置签名（CI 中自动设置，无 secrets 时 CI 会生成临时 keystore）
        // 无签名配置时执行 release 构建会直接失败，绝不回退 debug 签名
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("KEYSTORE_FILE")
            if (ksPath != null) {
                signingConfig signingConfigs.release
            } else {
                // 显式置空，防止 Gradle 默认回退 debug 签名
                signingConfig null
            }
        }
    }

    compileOptions {
        // Use Java 8 bytecode to avoid JdkImageTransform/jlink issues on some environments.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    // Avoid compressing large ML model assets to prevent :compressDebugAssets OOM.
    // This also speeds up packaging and avoids runtime extraction overhead.
    androidResources {
        noCompress += ["onnx", "ort", "bin", "dat", "tflite", "pt", "model"]
    }
}

// 无签名配置时禁止 release 构建（不静默回退 debug 签名）。
// CI（.github/workflows/build-android.yaml）总是会设置 KEYSTORE_FILE，不受影响。
gradle.taskGraph.whenReady { graph ->
    if (System.getenv("KEYSTORE_FILE") == null) {
        def releaseRequested = graph.allTasks.any { task ->
            task.project == project && task.name.toLowerCase().contains("release")
        }
        if (releaseRequested) {
            throw new GradleException(
                "Release 构建缺少签名配置，已中止（不会回退到 debug 签名）。\n" +
                "请设置以下环境变量后重试：\n" +
                "  KEYSTORE_FILE      keystore 文件路径\n" +
                "  KEYSTORE_PASSWORD  keystore 密码\n" +
                "  KEY_ALIAS          密钥别名\n" +
                "  KEY_PASSWORD       密钥密码\n" +
                "本地调试请使用 assembleDebug。")
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'

    // ONNX Runtime Mobile (CPU + NNAPI + XNNPACK)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.10.0'
}